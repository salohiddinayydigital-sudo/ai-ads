# Minimal packaging metadata. Tyrion has ZERO third-party runtime dependencies
# (Python standard library only); tools are run in place via `python3 tools/<name>.py`.
[project]
name = "tyrion-ai"
version = "8.0.1"
description = "Tyrion - calibrated AI paid media and targetology operating system (stdlib-only tooling)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Salohiddin" }]
dependencies = []

[project.urls]
Repository = "https://github.com/salohiddinayydigital-sudo/ai-ads"

# Not a distributable library: there is no installable package, only scripts.
[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["graphify-out", "wiki"]

[tool.ruff.lint]
select = ["E9", "F"]   # syntax errors + pyflakes (unused imports/variables, undefined names)
