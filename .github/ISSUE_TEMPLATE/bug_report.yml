name: Xato haqida xabar
description: Nimadir kutilganidek ishlamayapti
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Xato haqida xabar berishga vaqt ajratganingiz uchun rahmat! Iloji boricha batafsil to'ldiring.

  - type: dropdown
    id: os
    attributes:
      label: Operatsion tizim
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python versiyasi
      description: `python3 --version` ni ishga tushiring va chiqishni qo'ying
      placeholder: "masalan, 3.12.4"
    validations:
      required: false

  - type: input
    id: command
    attributes:
      label: Xato bergan buyruq
      description: Siz ishga tushirgan aniq Claude Code buyrug'i
      placeholder: "masalan, /ads google"
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: To'liq xato chiqishi
      description: Terminaldagi to'liq xatoni nusxalab qo'ying
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Reklama platformasi va akkaunt konteksti
      description: Qaysi reklama platformasi? Muammoni takrorlashga yordam beradigan akkaunt sozlamalari haqida ma'lumot bormi?
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Kutilgan xatti-harakat
      description: Nima bo'lishini kutgan edingiz?
    validations:
      required: false
