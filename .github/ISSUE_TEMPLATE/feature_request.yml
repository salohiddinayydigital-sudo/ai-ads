name: Funksiya taklifi
description: Yangi funksiya yoki yaxshilanishni taklif qiling
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Funksiya g'oyangiz bormi? Rasmiy so'rov ochishdan oldin uni hamjamiyat fikri uchun [GitHub Discussions](https://github.com/salohiddinayydigital-sudo/ai-ads/discussions) da ham muhokama qilishingiz mumkin.

  - type: textarea
    id: problem
    attributes:
      label: Bu qaysi muammoni hal qiladi?
      description: Duch kelgan kamchilik yoki cheklovni tasvirlang
      placeholder: "masalan, /ads google skilli konversiyaga asoslangan bidding yo'q kampaniyalarni belgilamaydi..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Taklif etilayotgan yechim
      description: Bu qanday ishlashini xohlaysiz?
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Bog'liq reklama platformasi (agar tegishli bo'lsa)
      multiple: true
      options:
        - Google Ads (AI Max bilan)
        - Meta Ads (Andromeda + GEM + Lattice bilan)
        - YouTube Ads (Demand Gen + CTV bilan)
        - LinkedIn Ads
        - TikTok Ads (USDS dan keyin)
        - Microsoft Ads
        - Apple Ads (avvalgi Apple Search Ads)
        - Amazon Ads (Sponsored Products / Brands / Display)
        - Atributsiya (AdAttributionKit, GA4, Consent Mode V2, MMP)
        - Server-side treking (sGTM, CAPI Gateway)
        - Platformalararo / Umumiy
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Ko'rib chiqilgan muqobillar
      description: Aylanma yo'llarni sinab ko'rdingizmi? Boshqa yondashuvlar bormi?
    validations:
      required: false
