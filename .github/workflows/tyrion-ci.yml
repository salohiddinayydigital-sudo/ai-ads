name: Tyrion v7.0 Global CI & Security Gate

on:
  push:
    branches: [ main, master, "feat/**", "sync/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for cross-platform hook & MCP launcher)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Catalog Parity & Mirror Drift Check
        run: |
          python tools/catalog.py check
          python tools/catalog.py drift

      - name: Vault Knowledge Graph & Delivery Gate Audit
        run: python tools/vault-audit.py . --gate

      - name: Universal Auto-Router Smoke Test (Global EU + Uzbekistan Market Packs)
        run: |
          python tools/skill-search.py route "My Shopify store in Germany has low ROAS on Meta" --json
          python tools/skill-search.py route "Toshkentda ko'chmas mulk uchun Meta reklama" --json

      - name: TyrionShield Static Security Audit
        run: python tools/tyrion-shield.py scan

      - name: Behavioral Eval Suite (24/24 Scenarios)
        run: python tools/skill-eval.py

      - name: Full Unit Test Suite (196 Tests including External-CWD Hook & MCP Verification)
        run: python -m unittest discover -s tests -t . -v

      - name: Doctor System Health Check
        run: python tools/doctor.py --quick
