name: Tyrion v8.0 Global CI & Security Gate

# Barcha branchlarda ishlaydi (claude/**, fix/**, feat/** ... hech biri chetda qolmaydi) va har bir PR da.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for cross-platform hook & MCP launcher)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Catalog Parity & Mirror Drift Check
        run: |
          python tools/catalog.py check
          python tools/catalog.py drift

      - name: Vault Knowledge Graph & Delivery Gate Audit
        run: python tools/vault-audit.py . --gate

      - name: Universal Auto-Router Smoke Test (Global EU + Uzbekistan Market Packs)
        run: |
          python tools/skill-search.py route "My Shopify store in Germany has low ROAS on Meta" --json
          python tools/skill-search.py route "Toshkentda ko'chmas mulk uchun Meta reklama" --json

      - name: TyrionShield Static Security Audit
        run: python tools/tyrion-shield.py scan

      - name: Behavioral Eval Suite (all scenarios must pass)
        run: python tools/skill-eval.py

      - name: Full Unit Test Suite (unittest discover, incl. real MCP stdio handshake)
        run: python -m unittest discover -s tests -t . -v

      - name: Doctor System Health Check
        run: python tools/doctor.py --quick

  coverage:
    name: Coverage gate (stdlib line coverage, minimum 70%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (MCP handshake test needs node)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Measure coverage of tools/ and hooks/ and enforce the minimum
        run: python tests/coverage_gate.py --min 70 --json coverage-report.json

      - name: Upload per-file coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.json

